<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a"/>
    <title>ByteVerse — The Architecture of Learning</title>
    <meta name="description" content="ByteVerse: personalized, adaptive AI learning. Memory and contextual awareness deliver a holistic learning experience. Text, flashcards, video, audio.">
    <meta property="og:title" content="ByteVerse — The Architecture of Learning">
    <meta property="og:description" content="Learns with you, for you. Personalized. Adaptive. Memory-aware.">
    <meta property="og:image" content="/og-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://byteverse.app/">
    <link rel="icon" href="/images/icons/ByteB_white.png" type="image/png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
      :root {
        --accent: #7D7DFF;
        --bg: #030303;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .font-syne { font-family: 'Syne', sans-serif; }
      .font-space { font-family: 'Space Grotesk', sans-serif; }
      
      .grain-container {
        position: fixed;
        inset: -10%;
        width: 120%;
        height: 120%;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
      }

      .grain {
        position: absolute;
        inset: 0;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.06;
        will-change: transform;
      }

      .apple-glass {
        background: rgba(255, 255, 255, 0.01);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .text-balance { text-wrap: balance; }
      
      html {
        scroll-behavior: smooth;
      }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased">
    <div class="grain-container">
      <div id="grain-overlay" class="grain"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const grain = document.getElementById('grain-overlay');
      let targetX = 0;
      let targetY = 0;
      let curX = 0;
      let curY = 0;

      window.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 50;
        targetY = (e.clientY / window.innerHeight - 0.5) * 50;
      });

      function loop() {
        curX += (targetX - curX) * 0.05;
        curY += (targetY - curY) * 0.05;
        if (grain) {
          grain.style.transform = `translate(${curX}px, ${curY}px)`;
        }
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>
