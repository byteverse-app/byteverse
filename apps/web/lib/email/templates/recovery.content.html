<h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;color:#ffffff;">Reset your password</h1>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:rgba(255,255,255,0.65);">
  We received a request to reset the password for your ByteVerse account. Choose a new password using the button below.
</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;">
  <tr>
    <td align="center" style="border-radius:12px;background-color:#5227FF;">
      <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:12px;">
        Reset password
      </a>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,0.45);">
  If you did not request a password reset, you can ignore this email. Your password will stay the same.
</p>
